name: Daily Event Scraper

on:
  schedule:
    - cron: '0 3 * * *' # UTC 03:00 (한국시간 12:00)
  workflow_dispatch: # 수동으로도 실행 가능하게 버튼 활성화

jobs:
  build:
    runs-on: ubuntu-latest
    # 권한 설정 (이게 있어야 events.json을 다시 push할 수 있습니다)
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper
        env:
          # GitHub Secrets에 등록한 API 키를 가져옵니다.
          # (Settings -> Secrets and variables -> Actions에 등록 필요)
          KAKAO_API_KEY: ${{ secrets.KAKAO_API_KEY }}
          KTO_TOUR_API_KEY: ${{ secrets.KTO_TOUR_API_KEY }}
          SEOUL_OPEN_API_KEY: ${{ secrets.SEOUL_OPEN_API_KEY }}
        run: python crawling/scraper.py

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add events.json
          # 변경사항이 있을 때만 커밋
          git diff --cached --quiet || git commit -m "Update events.json [$(date +'%Y-%m-%d %H:%M:%S')]"
          git push
